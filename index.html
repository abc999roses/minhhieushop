<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cửa Hàng Của Minh Hiếu</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Roboto', sans-serif; margin: 0; padding: 20px; background: #f4f4f9; }
    h1, h2, h3 { font-family: 'Montserrat', sans-serif; text-align: center; color: #333; }
    .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    
    .product-card { position: relative; background: #eef2f5; padding: 15px; border-radius: 8px; width: 250px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; display: flex; flex-direction: column; }
    .discount-badge { position: absolute; top: 10px; right: 10px; background: #ffd127; color: #ee4d2d; padding: 4px 8px; font-size: 13px; font-weight: bold; border-radius: 3px; z-index: 10;}
    .product-card img { max-width: 100%; height: 200px; object-fit: cover; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
    .product-card h3 { font-size: 16px; margin: 15px 0 5px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 40px; }
    .product-card p { font-size: 13px; color: #666; margin: 0 0 15px 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; flex-grow: 1; }
    
    .price-container { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; margin-top: auto; margin-bottom: 12px; min-height: 45px;}
    .original-price { color: #888; text-decoration: line-through; font-size: 0.9em; margin-bottom: 2px; }
    .current-price { color: #ee4d2d; font-weight: bold; font-size: 1.3em; }
    
    /* Thiết kế Nút bấm chính (Thêm giỏ hàng, Thanh toán) */
    .btn-primary { background: #0068ff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; font-family: 'Roboto', sans-serif; font-weight: 500;}
    .btn-primary:hover { background: #0055d4; }
    
    /* Thiết kế Bộ nút Tăng/Giảm số lượng */
    .qty-wrapper { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; }
    .qty-btn { background: #e0e0e0; color: #333; border: none; border-radius: 4px; cursor: pointer; font-size: 18px; font-weight: bold; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.1);}
    .qty-btn:hover { background: #ccc; }
    .qty-input { width: 45px; height: 32px; text-align: center; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; font-family: 'Roboto', sans-serif; box-sizing: border-box; }
    /* Ẩn mũi tên lên/xuống mặc định của input type="number" */
    .qty-input::-webkit-outer-spin-button, .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    
    /* Bộ nút số lượng thu nhỏ trong giỏ hàng */
    .cart-qty-wrapper { display: flex; align-items: center; gap: 5px; margin-top: 8px; }
    .qty-btn.small { width: 26px; height: 26px; font-size: 14px; }
    .qty-input.small { width: 40px; height: 26px; font-size: 14px; }

    .cart-section { max-width: 600px; margin: 30px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .cart-item { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 15px; gap: 15px;}
    .total-price { text-align: right; font-size: 1.5em; color: #d9534f; font-weight: bold; margin-top: 15px; }
    
    .form-group { margin-bottom: 15px; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: 'Roboto', sans-serif; font-size: 15px; background: white; }
    
    .form-group select {
      appearance: none;
      background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23666%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
      background-repeat: no-repeat; background-position: right 15px top 50%; background-size: 12px auto;
    }
    .form-group select:disabled { background-color: #f9f9f9; cursor: not-allowed; opacity: 0.7;}
    
    #loading { text-align: center; font-size: 1.2em; color: #666; margin-top: 50px; }
    #floating-cart { position: fixed; bottom: 20px; right: 20px; background-color: #ff4757; color: white; padding: 15px 25px; border-radius: 50px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; z-index: 1000; font-weight: bold; font-family: 'Montserrat', sans-serif; display: none; transition: transform 0.2s; }
    #floating-cart:hover { transform: scale(1.05); }
    #cart-count { background: white; color: #ff4757; border-radius: 50px; padding: 2px 8px; margin-left: 8px; font-size: 14px; }
  </style>
</head>
<body>

  <h1>CỬA HÀNG CỦA MINH HIẾU</h1>
  <div id="loading">Đang kết nối dữ liệu cửa hàng...</div>
  <div class="container" id="product-list"></div>

  <div id="floating-cart" onclick="scrollToCart()">
    🛒 Giỏ hàng <span id="cart-count">0</span>
  </div>

  <div class="cart-section" id="cart-section" style="display: none;">
    <h2>Giỏ hàng của bạn</h2>
    <div id="cart-items"></div>
    <div class="total-price" id="total-price">Tổng cộng: 0đ</div>

    <div style="margin-top: 30px;">
      <h3>Thông tin nhận hàng</h3>
      <div class="form-group"><input type="text" id="customer-name" placeholder="Tên người nhận *" required></div>
      <div class="form-group"><input type="number" id="customer-phone" placeholder="Số điện thoại Zalo *" required></div>
      
      <div class="form-group">
        <select id="tinh" onchange="fetchPhuong(this.value)" required>
          <option value="">Chọn Tỉnh / Thành phố *</option>
        </select>
      </div>
      <div class="form-group">
        <select id="phuong" required disabled>
          <option value="">Chọn Phường / Xã *</option>
        </select>
      </div>
      <div class="form-group"><input type="text" id="customer-address-detail" placeholder="Địa chỉ chi tiết (Số nhà, đường, ngõ...) *" required></div>
      <div class="form-group"><input type="text" id="customer-note" placeholder="Ghi chú (Tùy chọn, VD: Giao giờ hành chính...)"></div>

      <button class="btn-primary" onclick="checkout()" style="background: #ee4d2d; margin-top: 10px;">Lưu & Mở Zalo Gửi Đơn</button>
    </div>
  </div>

  <script>
    // === DÁN LINK WEB APP CỦA GOOGLE SCRIPT VÀO DƯỚI ĐÂY ===
    const API_URL = "https://script.google.com/macros/s/AKfycby6UyHtOTUpx9o841UXf1DlUf-Pbvonf3e8IpHpnEFudmdfDdkRuLsz_wtEr3vKFdm_/exec"; 
    
    // === SỐ ĐIỆN THOẠI ZALO CỦA BẠN ===
    const zaloPhone = "84355967766"; 
    
    let cart = [];

    window.onload = function() {
      loadProducts();
      fetchTinh(); 
    };

    async function loadProducts() {
      try {
        let response = await fetch(API_URL);
        let products = await response.json();
        renderProducts(products);
      } catch (error) {
        document.getElementById('loading').innerText = "Không thể tải dữ liệu, vui lòng kiểm tra lại Link API!";
      }
    }

    async function fetchTinh() {
      try {
        let res = await fetch('https://provinces.open-api.vn/api/v2/p/');
        let data = await res.json();
        let html = '<option value="">Chọn Tỉnh / Thành phố *</option>';
        data.forEach(item => { html += `<option value="${item.code}">${item.name}</option>`; });
        document.getElementById('tinh').innerHTML = html;
      } catch (error) { console.error("Lỗi API Tỉnh:", error); }
    }

    async function fetchPhuong(idTinh) {
      let phuongSelect = document.getElementById('phuong');
      phuongSelect.innerHTML = '<option value="">Chọn Phường / Xã *</option>';
      if(!idTinh) { phuongSelect.disabled = true; return; }
      phuongSelect.disabled = false;
      
      try {
        let res = await fetch(`https://provinces.open-api.vn/api/v2/p/${idTinh}?depth=2`);
        let data = await res.json();
        let html = '<option value="">Chọn Phường / Xã *</option>';
        if (data.wards) {
          data.wards.forEach(item => { html += `<option value="${item.code}">${item.name}</option>`; });
        }
        phuongSelect.innerHTML = html;
      } catch (error) { console.error("Lỗi API Phường:", error); }
    }

    function formatMoney(amount) { return Number(amount).toLocaleString('vi-VN') + "đ"; }

    // Xử lý tăng giảm số lượng trên Thẻ sản phẩm (chưa vào giỏ)
    function changeProductQty(id, delta) {
      let input = document.getElementById('qty-' + id);
      let val = parseInt(input.value) || 1;
      val += delta;
      if (val < 1) val = 1;
      input.value = val;
    }
    
    function validateProductQty(id) {
      let input = document.getElementById('qty-' + id);
      let val = parseInt(input.value);
      if (isNaN(val) || val < 1) input.value = 1;
    }

    function renderProducts(products) {
      document.getElementById('loading').style.display = 'none';
      const list = document.getElementById('product-list');
      
      products.forEach(p => {
        let card = document.createElement('div');
        card.className = 'product-card';
        
        let badgeHtml = '';
        let priceHtml = '';
        
        let orig = Number(p.originalPrice) || 0;
        let curr = Number(p.price) || 0;

        if (orig > curr && curr > 0) {
          let percent = Math.round(((orig - curr) / orig) * 100);
          badgeHtml = `<div class="discount-badge">-${percent}%</div>`;
          priceHtml = `
            <div class="original-price">${formatMoney(orig)}</div>
            <div class="current-price">${formatMoney(curr)}</div>
          `;
        } else {
          priceHtml = `
            <div class="original-price" style="visibility:hidden;">0đ</div>
            <div class="current-price">${formatMoney(curr)}</div>
          `;
        }

        let safeName = p.name.replace(/'/g, "\\'");
        
        card.innerHTML = `
          ${badgeHtml}
          <img src="${p.image}" alt="${safeName}">
          <h3>${p.name}</h3>
          <p>${p.desc}</p>
          <div class="price-container">
            ${priceHtml}
          </div>
          
          <!-- Nút điều chỉnh số lượng -->
          <div class="qty-wrapper">
            <button class="qty-btn" onclick="changeProductQty('${p.id}', -1)">-</button>
            <input type="number" id="qty-${p.id}" class="qty-input" value="1" min="1" onchange="validateProductQty('${p.id}')">
            <button class="qty-btn" onclick="changeProductQty('${p.id}', 1)">+</button>
          </div>
          
          <button class="btn-primary" onclick="addToCart('${p.id}', '${safeName}', ${curr})">Thêm vào giỏ</button>
        `;
        list.appendChild(card);
      });
    }

    function addToCart(id, name, price) {
      // Lấy số lượng khách vừa chọn
      let qtyInput = document.getElementById('qty-' + id);
      let qtyToAdd = parseInt(qtyInput.value) || 1;

      let item = cart.find(i => i.id === id);
      if (item) { 
        item.qty += qtyToAdd; 
      } else { 
        cart.push({ id, name, price, qty: qtyToAdd }); 
      }
      
      qtyInput.value = 1; // Khôi phục lại ô chọn về số 1
      updateCart();
      alert(`Đã thêm ${qtyToAdd} sản phẩm [ ${name} ] vào giỏ hàng!`);
    }

    // Xử lý tăng giảm số lượng TRONG giỏ hàng
    function changeCartQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty < 1) cart[index].qty = 1; // Không cho phép giảm xuống 0, muốn bỏ thì ấn Xóa
      updateCart();
    }
    
    function setCartQty(index, value) {
      let val = parseInt(value);
      if (isNaN(val) || val < 1) val = 1;
      cart[index].qty = val;
      updateCart();
    }

    function updateCart() {
      const cartDiv = document.getElementById('cart-items');
      const cartSection = document.getElementById('cart-section');
      const floatingCart = document.getElementById('floating-cart');
      
      cartDiv.innerHTML = '';
      let total = 0;
      let totalQty = 0; 
      const shippingFee = 18000;

      if (cart.length > 0) { 
        cartSection.style.display = 'block'; 
        floatingCart.style.display = 'block'; 
      } else { 
        cartSection.style.display = 'none'; 
        floatingCart.style.display = 'none'; 
      }

      cart.forEach((item, index) => {
        let itemTotal = item.price * item.qty;
        total += itemTotal;
        totalQty += item.qty;
        
        cartDiv.innerHTML += `
          <div class="cart-item">
            <div style="flex: 1; padding-right: 10px;">
              <b style="font-size: 14px; line-height: 1.4;">${item.name}</b>
              
              <!-- Nút điều chỉnh số lượng thu nhỏ trong giỏ -->
              <div class="cart-qty-wrapper">
                <button class="qty-btn small" onclick="changeCartQty(${index}, -1)">-</button>
                <input type="number" class="qty-input small" value="${item.qty}" min="1" onchange="setCartQty(${index}, this.value)">
                <button class="qty-btn small" onclick="changeCartQty(${index}, 1)">+</button>
              </div>
            </div>
            
            <div style="white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end;">
              <span style="font-weight: 500;">${formatMoney(itemTotal)}</span>
              <span style="color:red; cursor:pointer; margin-top:8px; font-weight:bold; font-size:0.9em;" onclick="removeItem(${index})">Xóa</span>
            </div>
          </div>
        `;
      });
      
      if (total > 0) {
        let finalTotal = total + shippingFee;
        document.getElementById('total-price').innerHTML = `
          <div style="font-size: 0.7em; color: #666; font-weight: normal;">Tiền hàng: ${formatMoney(total)}</div>
          <div style="font-size: 0.7em; color: #666; font-weight: normal;">Phí giao hàng: ${formatMoney(shippingFee)}</div>
          <div style="margin-top: 5px; color: #ee4d2d;">Tổng cộng: ${formatMoney(finalTotal)}</div>
        `;
      }
      
      document.getElementById('cart-count').innerText = totalQty; 
    }

    function removeItem(index) {
      cart.splice(index, 1);
      updateCart();
    }

    function scrollToCart() {
      document.getElementById('cart-section').scrollIntoView({ behavior: 'smooth' });
    }

    function checkout() {
      const name = document.getElementById('customer-name').value;
      const phone = document.getElementById('customer-phone').value;
      const detailAddress = document.getElementById('customer-address-detail').value;
      const note = document.getElementById('customer-note').value;
      
      const tinhSelect = document.getElementById('tinh');
      const phuongSelect = document.getElementById('phuong');
      
      const tinhName = tinhSelect.options[tinhSelect.selectedIndex]?.text || '';
      const phuongName = phuongSelect.options[phuongSelect.selectedIndex]?.text || '';

      const shippingFee = 18000;

      if (!name || !phone || !detailAddress || !tinhSelect.value || !phuongSelect.value) { 
        alert("Vui lòng điền đầy đủ Thông tin cá nhân và Địa chỉ nhận hàng!"); 
        return; 
      }

      let fullAddress = `${detailAddress}, ${phuongName}, ${tinhName}`;

      let orderText = "🛒 ĐƠN ĐẶT HÀNG MỚI\n";
      orderText += "👤 Khách: " + name + "\n";
      orderText += "📞 SĐT: " + phone + "\n";
      orderText += "📍 Địa chỉ: " + fullAddress + "\n";
      if(note) orderText += "📝 Ghi chú: " + note + "\n";
      orderText += "------------------------\n";
      
      let total = 0;
      cart.forEach(item => {
        orderText += `- ${item.name} (x${item.qty}): ${formatMoney(item.price * item.qty)}\n`;
        total += (item.price * item.qty);
      });
      
      let finalTotal = total + shippingFee;

      orderText += "------------------------\n";
      orderText += "📦 Tiền hàng: " + formatMoney(total) + "\n";
      orderText += "🚚 Phí giao hàng: " + formatMoney(shippingFee) + "\n";
      orderText += "💰 TỔNG THANH TOÁN: " + formatMoney(finalTotal);

      const tempTextArea = document.createElement("textarea");
      tempTextArea.value = orderText;
      document.body.appendChild(tempTextArea);
      tempTextArea.select();
      
      try {
        document.execCommand("copy");
        alert("📋 ĐÃ LƯU ĐƠN HÀNG!\n\nHệ thống sẽ mở Zalo của Shop. Bạn chỉ cần bấm DÁN (Paste) vào khung chat để gửi đơn nhé!");
      } catch (err) {
        alert("Trình duyệt không hỗ trợ copy tự động. Vui lòng nhắn tin trực tiếp cho Shop nhé!");
      }
      document.body.removeChild(tempTextArea);
      window.open("https://zalo.me/" + zaloPhone, "_blank");
    }
  </script>
</body>
</html>
